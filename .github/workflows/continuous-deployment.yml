name: Continuous Deployment

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - Continuous Integration
    branches:
      - main
    types:
      - completed
  repository_dispatch:
    types:
      - Upstream Sync Deployment
  workflow_dispatch:

concurrency:
  group: continuous-deployment-${{ github.event.workflow_run.head_branch || github.event.client_payload.branch || github.ref }}
  cancel-in-progress: false

jobs:
  deploy-worker:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Dependencies
        uses: ./.github/actions/retry-step
        with:
          command: pnpm install
          max_attempts: '3'

      # Materializes the gitignored root `wrangler.jsonc` from WRANGLER_JSONC (or
      # the template), applies the two patch variables, verifies template coverage,
      # and provisions missing D1/KV/Secrets Store resources. Every deploy step below
      # reads this one file, so the worker and the migration can never target different
      # databases.
      - name: Prepare Wrangler Configuration
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec tsx scripts/deploy/prepare-wrangler-config.ts
          max_attempts: '3'
        env:
          WRANGLER_JSONC: ${{ vars.WRANGLER_JSONC }}
          WRANGLER_PATCH_JSON: ${{ vars.WRANGLER_PATCH_JSON }}
          WRANGLER_VARS_PATCH_JSON: ${{ vars.WRANGLER_VARS_PATCH_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A template placeholder or a missing vars patch deploys a worker that
      # cannot forward anything: Email Sending needs a real envelope sender.
      - name: Validate Sending Address
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec tsx scripts/deploy/validate-send-from.ts
          max_attempts: '3'

      # Creates only secrets that are absent; an existing key is never overwritten.
      # The AES key is generated with WebCrypto and passed to wrangler on stdin, so it
      # never appears in the process table or in a log line.
      - name: Initialize Cloudflare Secrets Store
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec tsx scripts/deploy/init-secrets.ts
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The template's database name is stable, and `wrangler.jsonc` at the root is
      # generated from it. Backups resolve the same target from that file.
      - name: Apply Database Migration
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec wrangler d1 migrations apply mail-bee-db --remote --config ./wrangler.jsonc
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The worker serves this build through its `assets` binding, so it must run
      # before the dry-run: without it the deploy publishes an empty shell.
      - name: Build Web App
        run: pnpm --filter @mail-bee/web build

      - name: Dry Run Deploy with Wrangler
        run: pnpm exec wrangler deploy --dry-run --config ./wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy with Wrangler
        uses: ./.github/actions/retry-step
        with:
          command: pnpm exec wrangler deploy --config ./wrangler.jsonc
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Dependencies
        uses: ./.github/actions/retry-step
        with:
          command: pnpm install
          max_attempts: '3'

      - name: Build Frontend
        run: pnpm --filter @mail-bee/web build

      # The Pages site proxies API traffic to the deployed worker through the
      # `API_WORKER` service binding declared in the web template. `functions/[[path]].ts`
      # is the proxy, so the binding must be present in the config used by the deploy.
      - name: Configure Pages Service Bindings
        run: cp apps/web/wrangler.template.jsonc wrangler.jsonc

      - name: Ensure Pages Project Exists
        run: |
          PROJECT="${CLOUDFLARE_PAGES_PROJECT_NAME:-mail-bee-web}"
          echo "Ensuring Pages project \"${PROJECT}\" exists..."
          if CREATE_OUTPUT="$(pnpm exec wrangler pages project create "${PROJECT}" --production-branch "${DEPLOY_BRANCH:-main}" 2>&1)"; then
            echo "Created Pages project \"${PROJECT}\"."
          elif echo "${CREATE_OUTPUT}" | grep -qi "already exists"; then
            echo "Pages project \"${PROJECT}\" already exists."
          else
            echo "${CREATE_OUTPUT}"
            echo "Failed to create Pages project \"${PROJECT}\"." >&2
            exit 1
          fi
          echo "Waiting for Pages project \"${PROJECT}\" to become visible..."
          VISIBLE=0
          for _ in $(seq 1 18); do
            if pnpm exec wrangler pages project list 2>/dev/null | grep -qE "(^|[[:space:]])${PROJECT}([[:space:]]|$)"; then
              VISIBLE=1
              break
            fi
            sleep 5
          done
          if [ "${VISIBLE}" -ne 1 ]; then
            echo "Pages project \"${PROJECT}\" is still not visible after polling." >&2
            exit 1
          fi
          echo "Pages project \"${PROJECT}\" is ready."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'mail-bee-web' }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.client_payload.branch || github.ref_name }}

      - name: Deploy with Wrangler Pages
        uses: ./.github/actions/retry-step
        with:
          command: >
            pnpm exec wrangler pages deploy apps/web/dist
            --project-name "${CLOUDFLARE_PAGES_PROJECT_NAME:-mail-bee-web}"
            --branch "${DEPLOY_BRANCH}"
            --commit-hash "${DEPLOY_SHA}"
            --commit-message "$(git log -1 --pretty=%s)"
          max_attempts: '3'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'mail-bee-web' }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.event.client_payload.branch || github.ref_name }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.event.client_payload.sha || github.sha }}
